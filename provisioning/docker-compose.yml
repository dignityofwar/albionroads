services:
  db:
    container_name: db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dbname}
    ports:
      - '5432:5432'
    volumes:
      - ./volumes/db-data:/var/lib/postgresql/data

  server:
    container_name: server
    image: maelstromeous/albionroads:latest
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:password@db:5432/dbname}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      # The server's own liveness route. node 24 ships global fetch, so this
      # needs nothing extra installed in the image. update.sh's `up --wait`
      # blocks on it, which is what turns "started" into "actually serving".
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - db

  server-testing:
    container_name: server-testing
    image: maelstromeous/albionroads:testing-latest
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL_TESTING:-postgres://user:password@db:5432/dbname-testing}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - '3002:3001'
    healthcheck:
      # The server's own liveness route. node 24 ships global fetch, so this
      # needs nothing extra installed in the image. update.sh's `up --wait`
      # blocks on it, which is what turns "started" into "actually serving".
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - db
