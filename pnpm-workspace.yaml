packages:
  - 'web/*'
  - 'map-parser'

# Shared toolchain, pinned once so a lockfile-only bump can't resolve one
# package outside its own range and break --frozen-lockfile. Default catalog
# only: Renovate updates named catalogs without regenerating the lockfile.
catalog:
  '@types/node': ^24.0.0
  tsx: ^4.19.1
  typescript: ^5.5.3
  vitest: ^3.0.0
  zod: ^3.23.8

allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  vue-demi: true
  esbuild: true
