name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Backend Deployment gates the image build on this suite.
  workflow_call:

# A newer push to the same branch makes the in-flight run redundant. The workflow
# name is part of the group because on a backend push to main this runs twice —
# once from the push trigger, once called by Backend Deployment — on the same
# ref; without it the two would cancel each other and fail the deploy.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      # Matches the version the deploy image builds on (provisioning/Dockerfile).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `shared` is consumed from its compiled output, not its sources, so the
      # server and client suites cannot import it until it has been built.
      - name: Build shared
        run: pnpm --filter shared build

      - name: Test shared
        run: pnpm --filter shared test

      - name: Test server
        run: pnpm --filter server test

      - name: Test client
        run: pnpm --filter client test

      - name: Test map-parser
        run: pnpm --filter map-parser test

      # Covers the client's vue-tsc typecheck, which the suites don't.
      - name: Build
        run: pnpm build
